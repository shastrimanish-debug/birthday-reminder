name: birthday_reminder
description: Bizsy Beez Kids birthday reminder with customizable birthday cards.
publish_to: 'none'
version: 1.3.3+7

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.0
  flutter_tts: ^4.2.5
  timezone: ^0.11.1
  intl: ^0.20.3
  permission_handler: ^12.0.3
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
